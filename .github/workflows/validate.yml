name: Validate

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  BACKEND_PATH: Abricot-be
  FRONTEND_PATH: Abricot-few
  TERRAFORM_STATE_BUCKET: abricot-terraform-state
  TERRAFORM_LOCK_TABLE: abricot-terraform-lock
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_PATH }}
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: ${{ env.BACKEND_PATH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Build Lambda folders for Terraform archive data sources
        run: bash ./scripts/package_lambdas.sh

      - name: Terraform fmt
        working-directory: ${{ env.BACKEND_PATH }}/infra
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.BACKEND_PATH }}/infra
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ env.BACKEND_PATH }}/infra
        run: terraform validate

  backend-checks:
    name: Backend Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_PATH }}
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: ${{ env.BACKEND_PATH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.BACKEND_PATH }}/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Ruff lint
        run: python -m ruff check --no-fix .

      - name: Run tests
        run: python -m pytest

  frontend-checks:
    name: Frontend Node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_PATH }}
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FRONTEND_REPOSITORY || 'NaPrado/Abricot-few' }}
          token: ${{ secrets.FRONTEND_REPO_TOKEN || github.token }}
          path: ${{ env.FRONTEND_PATH }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint without modifying files
        run: pnpm exec oxlint . && pnpm exec eslint . --cache=false

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs:
      - terraform-validate
    defaults:
      run:
        working-directory: ${{ env.BACKEND_PATH }}
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: ${{ env.BACKEND_PATH }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Build Lambda folders for Terraform archive data sources
        run: bash ./scripts/package_lambdas.sh

      - name: Bootstrap Terraform backend
        run: |
          if ! aws s3api head-bucket --bucket "$TERRAFORM_STATE_BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$TERRAFORM_STATE_BUCKET" --region "$AWS_REGION"
          fi

          aws s3api put-bucket-versioning \
            --bucket "$TERRAFORM_STATE_BUCKET" \
            --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption \
            --bucket "$TERRAFORM_STATE_BUCKET" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          if ! aws dynamodb describe-table --table-name "$TERRAFORM_LOCK_TABLE" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$TERRAFORM_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name "$TERRAFORM_LOCK_TABLE"
          fi

      - name: Terraform init
        working-directory: ${{ env.BACKEND_PATH }}/infra
        run: terraform init

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.BACKEND_PATH }}/infra
        env:
          TF_VAR_postgres_password: ${{ secrets.TF_VAR_POSTGRES_PASSWORD }}
        run: terraform plan -lock=false -no-color -out=tfplan 2>&1 | tee plan.txt

      - name: Publish plan summary
        if: always()
        working-directory: ${{ env.BACKEND_PATH }}/infra
        run: |
          {
            echo "## Terraform plan"
            echo '```'
            tail -n 120 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.BACKEND_PATH }}/infra/plan.txt', 'utf8');
            const body = `## Terraform plan\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
