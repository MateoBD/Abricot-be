name: Destroy Production

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: Type DESTROY to confirm deleting Terraform-managed AWS resources.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  BACKEND_PATH: Abricot-be
  TERRAFORM_STATE_BUCKET: abricot-terraform-state
  TERRAFORM_LOCK_TABLE: abricot-terraform-lock
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: inputs.confirm_destroy == 'DESTROY'
    defaults:
      run:
        working-directory: ${{ env.BACKEND_PATH }}
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: ${{ env.BACKEND_PATH }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Build Lambda folders for Terraform archive data sources
        run: bash ./scripts/package_lambdas.sh

      - name: Verify Terraform backend exists
        run: |
          aws s3api head-bucket --bucket "$TERRAFORM_STATE_BUCKET"
          aws dynamodb describe-table --table-name "$TERRAFORM_LOCK_TABLE" >/dev/null

      - name: Terraform init
        working-directory: ${{ env.BACKEND_PATH }}/infra
        run: terraform init

      - name: Terraform destroy
        working-directory: ${{ env.BACKEND_PATH }}/infra
        env:
          TF_VAR_postgres_password: ${{ secrets.TF_VAR_POSTGRES_PASSWORD }}
        run: terraform destroy -auto-approve

      - name: Destroy summary
        run: |
          {
            echo "## Destroy"
            echo "Terraform-managed Abricot AWS resources were destroyed."
            echo "Bootstrap resources remain: $TERRAFORM_STATE_BUCKET and $TERRAFORM_LOCK_TABLE."
          } >> "$GITHUB_STEP_SUMMARY"
