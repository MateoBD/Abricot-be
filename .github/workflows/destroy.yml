name: Destroy Production

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: Type DESTROY to confirm deleting Terraform-managed AWS resources.
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  BACKEND_PATH: Abricot-be
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: inputs.confirm_destroy == 'DESTROY'
    defaults:
      run:
        working-directory: ${{ env.BACKEND_PATH }}
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: ${{ env.BACKEND_PATH }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Terraform backend
        env:
          TERRAFORM_STATE_BUCKET_VAR: ${{ vars.TERRAFORM_STATE_BUCKET }}
          TERRAFORM_LOCK_TABLE_VAR: ${{ vars.TERRAFORM_LOCK_TABLE }}
        run: |
          if [ -n "$TERRAFORM_STATE_BUCKET_VAR" ]; then
            echo "TERRAFORM_BACKEND_MODE=remote" >> "$GITHUB_ENV"
            echo "TERRAFORM_STATE_BUCKET=$TERRAFORM_STATE_BUCKET_VAR" >> "$GITHUB_ENV"
            echo "TERRAFORM_LOCK_TABLE=${TERRAFORM_LOCK_TABLE_VAR:-}" >> "$GITHUB_ENV"
          else
            echo "TERRAFORM_BACKEND_MODE=local" >> "$GITHUB_ENV"
            echo "TERRAFORM_STATE_BUCKET=" >> "$GITHUB_ENV"
            echo "TERRAFORM_LOCK_TABLE=" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Build Lambda folders for Terraform archive data sources
        run: bash ./scripts/package_lambdas.sh

      - name: Restore Terraform local state
        if: env.TERRAFORM_BACKEND_MODE == 'local'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.BACKEND_PATH }}/infra/terraform.tfstate
            ${{ env.BACKEND_PATH }}/infra/terraform.tfstate.backup
          key: terraform-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            terraform-state-${{ github.ref_name }}-

      - name: Verify Terraform backend exists
        if: env.TERRAFORM_BACKEND_MODE == 'remote'
        working-directory: ${{ env.BACKEND_PATH }}/infra
        run: |
          aws s3api head-bucket --bucket "$TERRAFORM_STATE_BUCKET"
          if [ -n "$TERRAFORM_LOCK_TABLE" ]; then
            aws dynamodb describe-table --table-name "$TERRAFORM_LOCK_TABLE" >/dev/null
          fi

          cat > backend.remote.tf <<'EOF'
          terraform {
            backend "s3" {
              key     = "abricot-be/terraform.tfstate"
              region  = "us-east-1"
              encrypt = true
            }
          }
          EOF

      - name: Terraform init
        working-directory: ${{ env.BACKEND_PATH }}/infra
        run: |
          rm -rf .terraform
          if [ "$TERRAFORM_BACKEND_MODE" = "local" ]; then
            rm -f backend.remote.tf
            terraform init -backend=false
          else
            init_args=(-backend-config="bucket=$TERRAFORM_STATE_BUCKET")
            if [ -n "$TERRAFORM_LOCK_TABLE" ]; then
              init_args+=(-backend-config="dynamodb_table=$TERRAFORM_LOCK_TABLE")
            fi
            terraform init -reconfigure "${init_args[@]}"
          fi

      - name: Allow destroy of protected lab resources
        working-directory: ${{ env.BACKEND_PATH }}/infra
        run: |
          sed -i '/prevent_destroy = true/d' private_database.tf
          sed -i '/ignore_changes  = all/d' private_database.tf

      - name: Import existing AWS resources into local state before destroy
        if: env.TERRAFORM_BACKEND_MODE == 'local'
        working-directory: ${{ env.BACKEND_PATH }}/infra
        env:
          TF_VAR_postgres_password: ${{ secrets.TF_VAR_POSTGRES_PASSWORD }}
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          name_prefix="abricot-tp3"

          import_if_missing() {
            local address="$1"
            local import_id="$2"

            if [ -z "$import_id" ] || [ "$import_id" = "None" ] || [ "$import_id" = "null" ]; then
              return 0
            fi

            if terraform state show "$address" >/dev/null 2>&1; then
              local current_id
              current_id="$(terraform state show -no-color "$address" | awk -F'= ' '/^[[:space:]]*id[[:space:]]+=/ { gsub(/"/, "", $2); print $2; exit }')"
              if [ "$current_id" = "$import_id" ]; then
                return 0
              fi

              echo "Replacing stale state for $address: $current_id -> $import_id"
              terraform state rm "$address"
            fi

            echo "Importing $address from $import_id"
            terraform import -input=false "$address" "$import_id" || true
          }

          import_if_absent() {
            local address="$1"
            local import_id="$2"

            if [ -z "$import_id" ] || [ "$import_id" = "None" ] || [ "$import_id" = "null" ]; then
              return 0
            fi

            if terraform state show "$address" >/dev/null 2>&1; then
              return 0
            fi

            echo "Importing $address from $import_id"
            terraform import -input=false "$address" "$import_id" || true
          }

          frontend_bucket="${name_prefix}-${account_id}-frontend"
          lambda_artifacts_bucket="${name_prefix}-${account_id}-lambda-artifacts"
          cognito_domain="${name_prefix}-${account_id}"
          db_subnet_group="${name_prefix}-private-db"
          db_instance="${name_prefix}-postgres"
          db_proxy="${name_prefix}-users-proxy"
          db_secret="${name_prefix}/postgres"

          existing_vpc_id="$(aws rds describe-db-subnet-groups \
            --db-subnet-group-name "$db_subnet_group" \
            --query 'DBSubnetGroups[0].VpcId' \
            --output text 2>/dev/null || true)"

          if [ -z "$existing_vpc_id" ] || [ "$existing_vpc_id" = "None" ]; then
            existing_vpc_id="$(aws ec2 describe-vpcs \
              --filters Name=cidr-block,Values=10.42.0.0/16 \
              --query 'Vpcs[0].VpcId' \
              --output text 2>/dev/null || true)"
          fi

          subnet_id_for_cidr() {
            local cidr="$1"
            aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=$existing_vpc_id" "Name=cidr-block,Values=$cidr" \
              --query 'Subnets[0].SubnetId' \
              --output text 2>/dev/null || true
          }

          security_group_id_for_name() {
            local group_name="$1"
            aws ec2 describe-security-groups \
              --filters "Name=vpc-id,Values=$existing_vpc_id" "Name=group-name,Values=$group_name" \
              --query 'SecurityGroups[0].GroupId' \
              --output text 2>/dev/null || true
          }

          if [ -n "$existing_vpc_id" ] && [ "$existing_vpc_id" != "None" ]; then
            import_if_missing 'aws_vpc.private[0]' "$existing_vpc_id"
            import_if_missing 'aws_internet_gateway.private[0]' "$(aws ec2 describe-internet-gateways \
              --filters "Name=attachment.vpc-id,Values=$existing_vpc_id" \
              --query 'InternetGateways[0].InternetGatewayId' \
              --output text 2>/dev/null || true)"
            import_if_missing 'aws_subnet.public[0]' "$(subnet_id_for_cidr '10.42.0.0/24')"
            import_if_missing 'aws_subnet.public[1]' "$(subnet_id_for_cidr '10.42.1.0/24')"
            import_if_missing 'aws_subnet.private_app[0]' "$(subnet_id_for_cidr '10.42.10.0/24')"
            import_if_missing 'aws_subnet.private_app[1]' "$(subnet_id_for_cidr '10.42.11.0/24')"
            import_if_missing 'aws_subnet.private_db[0]' "$(subnet_id_for_cidr '10.42.20.0/24')"
            import_if_missing 'aws_subnet.private_db[1]' "$(subnet_id_for_cidr '10.42.21.0/24')"
            import_if_missing 'aws_security_group.lambda[0]' "$(security_group_id_for_name "${name_prefix}-lambda-sg")"
            import_if_missing 'aws_security_group.rds_proxy[0]' "$(security_group_id_for_name "${name_prefix}-rds-proxy-sg")"
            import_if_missing 'aws_security_group.rds[0]' "$(security_group_id_for_name "${name_prefix}-rds-sg")"
          fi

          if aws s3api head-bucket --bucket "$frontend_bucket" >/dev/null 2>&1; then
            import_if_missing 'aws_s3_bucket.frontend' "$frontend_bucket"
          fi

          if aws s3api head-bucket --bucket "$lambda_artifacts_bucket" >/dev/null 2>&1; then
            import_if_missing 'aws_s3_bucket.lambda_artifacts' "$lambda_artifacts_bucket"
          fi

          user_pool_id="$(aws cognito-idp list-user-pools \
            --max-results 60 \
            --query "UserPools[?Name=='${name_prefix}-user-pool'].Id | [0]" \
            --output text 2>/dev/null || true)"
          import_if_missing 'aws_cognito_user_pool.main' "$user_pool_id"

          if [ -n "$user_pool_id" ] && [ "$user_pool_id" != "None" ]; then
            import_if_missing 'aws_cognito_user_pool_domain.main' "$cognito_domain"
          fi

          if aws rds describe-db-subnet-groups --db-subnet-group-name "$db_subnet_group" >/dev/null 2>&1; then
            import_if_missing 'aws_db_subnet_group.private[0]' "$db_subnet_group"
          fi

          if aws rds describe-db-instances --db-instance-identifier "$db_instance" >/dev/null 2>&1; then
            import_if_missing 'aws_db_instance.postgres[0]' "$db_instance"
          fi

          secret_arn="$(aws secretsmanager describe-secret \
            --secret-id "$db_secret" \
            --query ARN \
            --output text 2>/dev/null || true)"
          import_if_missing 'aws_secretsmanager_secret.db[0]' "$secret_arn"

          if aws rds describe-db-proxies --db-proxy-name "$db_proxy" >/dev/null 2>&1; then
            import_if_absent 'aws_db_proxy.users[0]' "$db_proxy"
            import_if_absent 'aws_db_proxy_default_target_group.users[0]' "${db_proxy}/default"
          fi

      - name: Empty versioned S3 buckets
        working-directory: ${{ env.BACKEND_PATH }}/infra
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"

          empty_versioned_bucket() {
            local bucket="$1"

            if [ -z "$bucket" ] || [ "$bucket" = "null" ]; then
              return 0
            fi

            if ! aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
              echo "Bucket $bucket does not exist; skipping."
              return 0
            fi

            echo "Emptying all object versions from $bucket"
            while true; do
              versions="$(aws s3api list-object-versions \
                --bucket "$bucket" \
                --query 'Versions[0:1000].{Key:Key,VersionId:VersionId}' \
                --output json)"
              delete_markers="$(aws s3api list-object-versions \
                --bucket "$bucket" \
                --query 'DeleteMarkers[0:1000].{Key:Key,VersionId:VersionId}' \
                --output json)"

              if [ "$versions" = "null" ]; then
                versions="[]"
              fi

              if [ "$delete_markers" = "null" ]; then
                delete_markers="[]"
              fi

              delete_payload="$(jq -c -n \
                --argjson versions "$versions" \
                --argjson delete_markers "$delete_markers" \
                '{Objects: ($versions + $delete_markers), Quiet: true}')"

              object_count="$(jq '.Objects | length' <<< "$delete_payload")"
              if [ "$object_count" -eq 0 ]; then
                break
              fi

              aws s3api delete-objects \
                --bucket "$bucket" \
                --delete "$delete_payload" >/dev/null
            done
          }

          frontend_bucket="abricot-tp3-${account_id}-frontend"
          lambda_artifacts_bucket="abricot-tp3-${account_id}-lambda-artifacts"

          empty_versioned_bucket "$frontend_bucket"
          empty_versioned_bucket "$lambda_artifacts_bucket"

      - name: Terraform destroy
        working-directory: ${{ env.BACKEND_PATH }}/infra
        env:
          TF_VAR_postgres_password: ${{ secrets.TF_VAR_POSTGRES_PASSWORD }}
        run: terraform destroy -auto-approve

      - name: Destroy summary
        run: |
          {
            echo "## Destroy"
            echo "Terraform-managed Abricot AWS resources were destroyed."
            echo "Terraform backend mode: $TERRAFORM_BACKEND_MODE."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Terraform local state
        if: always() && env.TERRAFORM_BACKEND_MODE == 'local'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.BACKEND_PATH }}/infra/terraform.tfstate
            ${{ env.BACKEND_PATH }}/infra/terraform.tfstate.backup
          key: terraform-state-${{ github.ref_name }}-${{ github.run_id }}
