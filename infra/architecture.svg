<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#444"/>
    </marker>
    <style>
      .box{rx:8;ry:8;stroke-width:1.5;}
      .lbl{fill:#1a1a1a;}
      .sub{fill:#555;font-size:11px;}
      .edge{stroke:#444;stroke-width:1.4;fill:none;marker-end:url(#arrow);}
      .zone{fill:none;stroke-dasharray:6 4;stroke-width:1.5;}
      .ztext{font-size:12px;font-weight:bold;}
    </style>
  </defs>

  <text x="20" y="28" font-size="18" font-weight="bold" fill="#111">Abricot TP3 — AWS Serverless + Private Database Architecture</text>
  <text x="20" y="46" class="sub">Terraform root module · custom module: lambda_function · external module: terraform-aws-modules/s3-bucket</text>

  <!-- Client / Frontend -->
  <rect class="box" x="20" y="80" width="180" height="60" fill="#eef6ff" stroke="#3b82f6"/>
  <text class="lbl" x="110" y="105" text-anchor="middle" font-weight="bold">Browser SPA</text>
  <text class="sub" x="110" y="124" text-anchor="middle">S3 static website</text>

  <!-- Cognito -->
  <rect class="box" x="20" y="180" width="180" height="64" fill="#fef3f2" stroke="#ef4444"/>
  <text class="lbl" x="110" y="205" text-anchor="middle" font-weight="bold">Cognito</text>
  <text class="sub" x="110" y="223" text-anchor="middle">User Pool · Hosted UI</text>
  <text class="sub" x="110" y="237" text-anchor="middle">SPA client · JWT issuer</text>

  <!-- API Gateway -->
  <rect class="box" x="270" y="120" width="200" height="92" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text class="lbl" x="370" y="146" text-anchor="middle" font-weight="bold">API Gateway (HTTP)</text>
  <text class="sub" x="370" y="166" text-anchor="middle">64 routes via for_each</text>
  <text class="sub" x="370" y="182" text-anchor="middle">JWT authorizer (Cognito)</text>
  <text class="sub" x="370" y="198" text-anchor="middle">public + protected routes</text>

  <!-- S3 artifacts (external module) -->
  <rect class="box" x="20" y="300" width="200" height="64" fill="#ecfdf5" stroke="#10b981"/>
  <text class="lbl" x="120" y="324" text-anchor="middle" font-weight="bold">S3 lambda-artifacts</text>
  <text class="sub" x="120" y="342" text-anchor="middle">external s3-bucket module</text>
  <text class="sub" x="120" y="356" text-anchor="middle">versioned · AES256 · private</text>

  <!-- VPC zone -->
  <rect class="zone" x="520" y="70" width="580" height="470" stroke="#0ea5e9"/>
  <text class="ztext" x="535" y="90" fill="#0ea5e9">VPC 10.42.0.0/16 (2 AZs)</text>

  <!-- private app subnets -->
  <rect class="zone" x="540" y="100" width="270" height="180" stroke="#6366f1"/>
  <text class="ztext" x="552" y="118" fill="#6366f1">Private app subnets</text>

  <!-- Lambda module -->
  <rect class="box" x="560" y="130" width="230" height="130" fill="#fff7ed" stroke="#f59e0b"/>
  <text class="lbl" x="675" y="152" text-anchor="middle" font-weight="bold">module.lambda (for_each)</text>
  <text class="sub" x="675" y="172" text-anchor="middle">users · catalog · orders</text>
  <text class="sub" x="675" y="188" text-anchor="middle">restaurants · reservations</text>
  <text class="sub" x="675" y="204" text-anchor="middle">promotions · analytics</text>
  <text class="sub" x="675" y="220" text-anchor="middle">health · db_migrate</text>
  <text class="sub" x="675" y="240" text-anchor="middle">lambda-sg · VPC attached</text>

  <!-- private db subnets -->
  <rect class="zone" x="540" y="300" width="540" height="220" stroke="#6366f1"/>
  <text class="ztext" x="552" y="318" fill="#6366f1">Private DB subnets (AZ A + AZ B)</text>

  <!-- RDS Proxy -->
  <rect class="box" x="560" y="335" width="180" height="60" fill="#eff6ff" stroke="#2563eb"/>
  <text class="lbl" x="650" y="360" text-anchor="middle" font-weight="bold">RDS Proxy</text>
  <text class="sub" x="650" y="378" text-anchor="middle">rds-proxy-sg · Secrets Mgr</text>

  <!-- RDS primary/standby -->
  <rect class="box" x="560" y="420" width="180" height="56" fill="#eef2ff" stroke="#4338ca"/>
  <text class="lbl" x="650" y="443" text-anchor="middle" font-weight="bold">RDS PostgreSQL</text>
  <text class="sub" x="650" y="460" text-anchor="middle">Multi-AZ primary/standby · rds-sg</text>

  <!-- NAT -->
  <rect class="box" x="830" y="130" width="120" height="50" fill="#f1f5f9" stroke="#64748b"/>
  <text class="lbl" x="890" y="152" text-anchor="middle" font-weight="bold">NAT GW</text>
  <text class="sub" x="890" y="170" text-anchor="middle">egress 443</text>

  <!-- SNS domain events -->
  <rect class="box" x="830" y="335" width="230" height="50" fill="#fef2f8" stroke="#db2777"/>
  <text class="lbl" x="945" y="357" text-anchor="middle" font-weight="bold">SNS domain-events</text>
  <text class="sub" x="945" y="374" text-anchor="middle">fan-out after order commit</text>

  <!-- SQS + workers -->
  <rect class="box" x="830" y="410" width="110" height="56" fill="#fffbeb" stroke="#d97706"/>
  <text class="lbl" x="885" y="432" text-anchor="middle" font-weight="bold">SQS email</text>
  <text class="sub" x="885" y="450" text-anchor="middle">+ DLQ</text>

  <rect class="box" x="950" y="410" width="110" height="56" fill="#fffbeb" stroke="#d97706"/>
  <text class="lbl" x="1005" y="432" text-anchor="middle" font-weight="bold">SQS analytics</text>
  <text class="sub" x="1005" y="450" text-anchor="middle">+ DLQ</text>

  <!-- workers + email topic (outside VPC) -->
  <rect class="box" x="830" y="560" width="110" height="56" fill="#fff7ed" stroke="#f59e0b"/>
  <text class="lbl" x="885" y="582" text-anchor="middle" font-weight="bold">email-worker</text>
  <text class="sub" x="885" y="600" text-anchor="middle">outside VPC</text>

  <rect class="box" x="950" y="560" width="110" height="56" fill="#fff7ed" stroke="#f59e0b"/>
  <text class="lbl" x="1005" y="582" text-anchor="middle" font-weight="bold">analytics-worker</text>
  <text class="sub" x="1005" y="600" text-anchor="middle">logs events</text>

  <rect class="box" x="830" y="650" width="110" height="50" fill="#fef3f2" stroke="#ef4444"/>
  <text class="lbl" x="885" y="672" text-anchor="middle" font-weight="bold">SNS email</text>
  <text class="sub" x="885" y="689" text-anchor="middle">native email</text>

  <!-- edges -->
  <path class="edge" d="M110,140 L110,180"/>
  <path class="edge" d="M200,110 L270,140"/>
  <path class="edge" d="M200,210 L270,180"/>
  <path class="edge" d="M470,166 L560,180"/>
  <path class="edge" d="M220,332 L560,250" stroke-dasharray="2 2"/>
  <path class="edge" d="M790,200 L840,180" stroke-dasharray="3 3"/>
  <path class="edge" d="M675,260 L660,335"/>
  <path class="edge" d="M650,395 L650,420"/>
  <path class="edge" d="M790,230 L945,335"/>
  <path class="edge" d="M918,385 L890,410"/>
  <path class="edge" d="M972,385 L1005,410"/>
  <path class="edge" d="M885,466 L885,560"/>
  <path class="edge" d="M1005,466 L1005,560"/>
  <path class="edge" d="M885,616 L885,650"/>

  <text class="sub" x="232" y="120">OAuth code</text>
  <text class="sub" x="225" y="250">deploy ZIP</text>
  <text class="sub" x="700" y="300">RDS Proxy only</text>
  <text class="sub" x="800" y="300">order.created</text>
</svg>
